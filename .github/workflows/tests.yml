name: Selenium Java CI/CD

on:
  push:
    branches: [ main, master, base-automation-java-se ]
  pull_request:
    branches: [ main, master, base-automation-java-se ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests with Maven
        # This command runs your testng.xml via the surefire plugin also in headless mode
        run: mvn test -DsuiteXmlFile=testng.xml -Dheadless=true

      - name: Upload Screenshots on Failure
        if: failure() # Only runs if the 'Run Tests' step failed
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/